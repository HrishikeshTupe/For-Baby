<!DOCTYPE html>
<html>
<head>
<title>Do You Love Me?</title>
<style>
body{
    font-family: Arial;
    text-align:center;
    background:pink;
    margin-top:100px;
}
button{
    padding:15px 30px;
    font-size:20px;
    margin:10px;
    cursor:pointer;
}
#no{
    position:absolute;
}
h1{
    color:red;
}
</style>
</head>
<body>

<h1>Do you love me? ❤️</h1>

<button onclick="love()">Yes ❤️</button>
<button id="no" onmouseover="moveNo()">No 😜</button>

<script>
function moveNo(){
    let btn=document.getElementById("no");
    btn.style.left=Math.random()*80+"vw";
    btn.style.top=Math.random()*80+"vh";
}

function love(){
    document.body.innerHTML=`
    <h1 style="font-size:60px;color:red">
    I LOVE YOU ❤️🥰
    </h1>
    <h2>You made my day!</h2>
    `;
}
</script>

</body>
</html>
